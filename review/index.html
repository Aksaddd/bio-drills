<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Review List</title>
<meta name="description" content="Every question you've marked for review in the Bi 239 drills, in one place.">
<meta name="theme-color" content="#f5f5f7">
<link rel="stylesheet" href="../assets/drill.css">
<script src="../assets/settings.js"></script>
<script src="../assets/xp.js"></script>
<script src="../assets/wardrobe.js"></script>
<script src="../assets/buddy.js"></script>
<style>
/* Layout: one study column. Header with counts and two actions (Quiz me, filters) → a list of flagged
   questions, each with Show answer / Remove. Quiz mode replaces the list with one question card at a time. */
.rhead{display:flex;flex-direction:column;gap:6px}
.bar2{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.filters .chip span{font:600 11.5px var(--mono);opacity:.75;margin-left:4px}
.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.item .q{font-size:calc(17px * var(--rs))}
.item .fig img{max-height:220px}
.drilltag{font:700 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.answers{display:flex;flex-direction:column;gap:5px;font-size:calc(14.5px * var(--rs))}
.answers div{padding:7px 11px;border-radius:9px;border:1px solid var(--line)}
.answers .r{background:var(--good-soft);border-color:var(--good);font-weight:600}
.iacts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.empty{text-align:center;align-items:center;gap:10px}
.empty h2{font:800 24px var(--display);margin:0}
.item .meta>.meta-l,.card .meta>.meta-l{white-space:normal;flex:1 1 auto}
.iacts .sublink{font-size:13.5px;text-decoration:none;margin-left:auto}
.iacts .sublink:hover{text-decoration:underline}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
</style>
<!-- Vercel Web Analytics: anonymous page views, no cookies (enable Analytics for the project in the Vercel dashboard) -->
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head><body>
<div class="wrap">
  <header class="rhead">
    <a class="back" href="../index.html">← All drills</a>
    <h1>Review List</h1>
    <p class="sub" id="lede">Every question you've marked for review, from every drill. Mark questions with <b>⚑ Mark for review</b> in the drill.</p>
  </header>
  <main id="app"></main>
  <p class="foot">Saved in this browser on this device, together with your drill progress.</p>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="lightbox" id="lightbox" hidden><img id="lbImg" alt=""><button id="lbClose" type="button">Close</button></div>
<script src="../assets/glossary.js"></script>
<script src="bank.js"></script>
<script>
(() => {
  const isProf = src => !/^Practice/i.test(String(src));   // every source except the practice sets came straight from the professor
  // Practice questions were written from the professor's material: say which
  const basedOn = src => { src = String(src); if (!/^Practice/i.test(src)) return ""; return /study guide/i.test(src) ? "the professor's study guide" : /lecture slides/i.test(src) ? "the lecture slides" : /worksheet/i.test(src) ? "the professor's worksheet" : "class material" };
  const basedBadge = src => basedOn(src) ? `<span class="based" title="Written for this site from ${basedOn(src)}">✎ Based on ${basedOn(src)}</span>` : "";
  const whyNot = t => { const d = window.GLOSS && window.GLOSS.look(t); return d ? `<span class="whynot"><b>Why not “${esc(String(t).replace(/<[^>]*>/g, ""))}”?</b> ${esc(d)}</span>` : "" };
  const RB = window.REVIEW_BANK, DRILLS = Object.keys(RB);
  // ?exam=1 or ?exam=2: show only that exam's drills (Exam 2 = the Exam 2 and Classification drills, incl. mock-exam flags)
  const EXAM = new URLSearchParams(location.search).get("exam");
  const SHOW = DRILLS;
  if (false) {
    document.title = `Exam ${EXAM} Review List`;
    document.querySelector(".rhead h1").textContent = `Exam ${EXAM} Review List`;
    document.getElementById("lede").innerHTML = EXAM === "1"
      ? "Every Exam 1 question you've marked for review. Mark questions with <b>⚑ Mark for review</b> in the Exam 1 drill."
      : "Every Exam 2 question you've marked for review, from the Exam 2 and Classification drills and your mock exams. Mark questions with <b>⚑ Mark for review</b> in a drill, or flag them in a mock exam.";
  }
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const txt = (d, s) => RB[d].html ? String(s) : esc(s);       // Exam 1 questions contain small bits of markup
  const shuffle = a => { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.random() * (k + 1) | 0; [a[k], a[j]] = [a[j], a[k]] } return a };
  const load = d => { try { return JSON.parse(localStorage.getItem(RB[d].key) || "null") } catch (e) { return null } };
  const store = (d, s) => { s.updatedAt = Date.now(); try { localStorage.setItem(RB[d].key, JSON.stringify(s)) } catch (e) { } };
  const dayKey = (t = new Date()) => t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
  function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `<i></i>${esc(m)}`; $("toasts").appendChild(t); setTimeout(() => t.remove(), 2600) }

  // Reading settings from the drills apply here too
  try {
    const r = JSON.parse(localStorage.getItem("bio-reading") || "null");
    const stacks = { atkinson: ['"Atkinson Hyperlegible Next",system-ui,sans-serif', "https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap"], literata: ['Literata,Georgia,serif', "https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;600;700&display=swap"], system: ['-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif'], plex: ['"IBM Plex Sans",system-ui,sans-serif', "https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"] };
    if (r && stacks[r.font]) { const [st, href] = stacks[r.font]; if (href) { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = href; document.head.appendChild(l) } document.documentElement.style.setProperty("--read", st) }
    if (r && [.9, 1, 1.12, 1.25][r.size]) document.documentElement.style.setProperty("--rs", [.9, 1, 1.12, 1.25][r.size]);
  } catch (e) { }

  // Every flagged question, newest flag first
  function flagged() {
    const out = [];
    for (const d of SHOW) {
      const s = load(d); if (!s || !s.mark) continue;
      for (const id in s.mark) if (s.mark[id] && s.mark[id].m === "review" && RB[d].items[id]) out.push({ d, id, t: s.mark[id].t || 0, q: RB[d].items[id] });
    }
    // the same worksheet question can be flagged in both Exam 2 and Classification: show it once
    const seen = new Set();
    return out.sort((a, b) => b.t - a.t).filter(x => { const k = x.q.q + "|" + x.q.ok; if (seen.has(k)) return false; seen.add(k); return true });
  }
  function unflag(x) {
    for (const d of DRILLS) {   // remove it everywhere it's flagged (shared worksheet questions live in two drills)
      const s = load(d); if (!s || !s.mark) continue; let ch = false;
      for (const id in s.mark) { const q = RB[d].items[id]; if (q && q.q === x.q.q && q.ok === x.q.ok && s.mark[id].m === "review") { delete s.mark[id]; ch = true } }
      if (ch) store(d, s);
    }
  }
  // Record a quiz answer in the drill it belongs to, with the same rules the drill uses (streak, attempts, today).
  function record(x, good) {
    const s = load(x.d) || { v: 2, deck: "", shuffle: true, missed: [], hist: {}, stats: {}, log: {}, mark: {}, days: {}, rounds: {} };
    s.stats = s.stats || {}; s.log = s.log || {}; s.hist = s.hist || {}; s.days = s.days || {}; s.missed = s.missed || [];
    const now = Date.now(), st = s.stats[x.id] || [0, 0]; s.stats[x.id] = [st[0] + 1, st[1] + (good ? 1 : 0)];
    const g = s.log[x.id] || { s: 0, t0: 0, last: 0 }; if (good) { if (!g.s) g.t0 = now; g.s++ } else { g.s = 0; g.t0 = 0 } g.last = now; s.log[x.id] = g;
    s.hist[x.id] = good ? 1 : 0;
    const m = new Set(s.missed); good ? m.delete(x.id) : m.add(x.id); s.missed = [...m];
    const dk = dayKey(); s.days[dk] = (s.days[dk] | 0) + 1;
    store(x.d, s);
  }

  let filter = "all", open = new Set(), quiz = null;
  const figure = q => q.img ? `<figure class="fig"><button type="button" class="zoom" data-src="${q.img[0]}" aria-label="Enlarge image"><img src="${q.img[0]}" alt="${esc(q.img[1])}"></button><figcaption>Tap to zoom</figcaption></figure>` : "";
  function wireZoom() { $("app").querySelectorAll(".zoom").forEach(z => z.onclick = () => { $("lbImg").src = z.dataset.src; $("lightbox").hidden = false }) }

  function renderList() {
    const all = flagged(), list = filter === "all" ? all : all.filter(x => x.d === filter);
    const count = d => all.filter(x => x.d === d).length;
    if (!all.length) {
      $("app").innerHTML = `<section class="card empty"><h2>Nothing marked for review</h2>
        <p class="sub">In any drill, tap <b>⚑ Mark for review</b> under a question you want to come back to. They'll all collect here.</p>
        <div class="nav" style="justify-content:center"><a class="btn" href="../drill/index.html" style="text-decoration:none"><span>Open the drill</span></a><a class="btn ghost" href="../hw3/index.html" style="text-decoration:none"><span>HW 3 answer key</span></a></div></section>`;
      return;
    }
    $("app").innerHTML = `<div class="bar2">
        <div class="filters">${[["all", "All", all.length], ...DRILLS.filter(count).map(d => [d, RB[d].name, count(d)])].map(([k, l, n]) => `<button class="chip" data-f="${k}" aria-pressed="${filter === k}">${esc(l)}<span>${n}</span></button>`).join("")}</div>
        <button class="btn" id="quizBtn"><span>Quiz me on ${list.length === 1 ? "this question" : `these ${list.length}`}</span></button>
      </div>
      <div class="items">${list.map((x, i) => `<article class="item" data-i="${i}">
          <div class="meta"><span class="meta-l"><span class="drilltag">${esc(RB[x.d].name)}</span>${basedBadge(x.q.src)}${isProf(x.q.src) ? `<span class="prof" title="This question comes straight from the professor's course materials">★ From the professor</span>` : ""}<span class="origin">Source: ${esc(x.q.src)}</span><span>${esc(x.q.subject)}</span></span></div>
          <p class="q">${txt(x.d, x.q.q)}</p>${figure(x.q)}
          ${open.has(x.d + x.id) ? `<div class="answers">${[x.q.ok, ...x.q.wrong].map(t => `<div class="${t === x.q.ok ? "r" : ""}">${txt(x.d, t)}${t === x.q.ok ? " ✓" : ""}</div>`).join("")}</div>${x.q.ex ? `<div class="explain good">${txt(x.d, x.q.ex)}</div>` : ""}` : ""}
          <div class="iacts"><button class="chip" data-show="${i}">${open.has(x.d + x.id) ? "Hide answer" : "Show answer"}</button><button class="mk mk-review" aria-pressed="true" data-rm="${i}">⚑ Remove from review</button><a class="sublink" href="${RB[x.d].href}">Open ${esc(RB[x.d].name)} drill →</a></div>
        </article>`).join("")}</div>`;
    $("app").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; renderList() });
    $("app").querySelectorAll("[data-show]").forEach(b => b.onclick = () => { const x = list[+b.dataset.show], k = x.d + x.id; open.has(k) ? open.delete(k) : open.add(k); renderList() });
    $("app").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { unflag(list[+b.dataset.rm]); toast("Removed from review"); if (filter !== "all" && !flagged().some(x => x.d === filter)) filter = "all"; renderList() });
    $("quizBtn").onclick = () => startQuiz(list);
    wireZoom();
  }

  // ----- Quiz mode: one question at a time, answers are saved to the question's drill progress
  function startQuiz(list) { quiz = { list: shuffle(list), i: 0, right: 0, done: false }; renderQuiz(); window.scrollTo({ top: 0 }) }
  function renderQuiz() {
    const { list, i } = quiz;
    if (i >= list.length) {
      $("app").innerHTML = `<section class="card empty"><h2>${quiz.right} of ${list.length} right</h2>
        <p class="sub">Your answers were saved to each drill's progress. Questions you got right can be removed from review as you go.</p>
        <div class="nav" style="justify-content:center"><button class="btn" id="backList"><span>Back to the review list</span></button></div></section>`;
      $("backList").onclick = () => { quiz = null; renderList() }; return;
    }
    const x = list[i], opts = shuffle([x.q.ok, ...x.q.wrong]);
    $("app").innerHTML = `<div class="qtop"><span>Question <b>${i + 1}</b> of ${list.length} · <b>${quiz.right}</b> right</span><button class="chip" id="exitQuiz">Back to the list</button></div>
      <main class="card enter">
        <div class="meta"><span class="meta-l"><span class="drilltag">${esc(RB[x.d].name)}</span>${basedBadge(x.q.src)}${isProf(x.q.src) ? `<span class="prof" title="This question comes straight from the professor's course materials">★ From the professor</span>` : ""}<span class="origin">Source: ${esc(x.q.src)}</span><span>${esc(x.q.subject)}</span></span></div>
        <p class="q">${txt(x.d, x.q.q)}</p>${figure(x.q)}
        <div class="opts">${opts.map((t, j) => `<button class="opt" data-j="${j}"><span class="bub">${"ABCDE"[j]}</span><span>${txt(x.d, t)}</span></button>`).join("")}</div>
        <div id="fb"></div>
      </main>`;
    $("exitQuiz").onclick = () => { quiz = null; renderList() };
    wireZoom();
    $("app").querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const j = +b.dataset.j, good = opts[j] === x.q.ok;
      $("app").querySelectorAll(".opt").forEach(o => { o.disabled = true; if (opts[+o.dataset.j] === x.q.ok) o.classList.add("right") });
      b.classList.add("picked", good ? "pop" : "shake"); if (!good) b.classList.add("wrong");
      if (good) quiz.right++;
      record(x, good);
      $("fb").innerHTML = `<div class="explain ${good ? "good" : "bad"}"><strong>${good ? "Correct!" : "Not quite. The answer is: " + txt(x.d, x.q.ok)}</strong>${x.q.ex ? `<span class="exwhy"><b>Why:</b> ${txt(x.d, x.q.ex)}</span>` : ""}${!good ? whyNot(opts[j]) : ""}</div>
        <div class="nav">${good ? `<button class="mk mk-review" aria-pressed="true" id="rmNow">⚑ Remove from review</button>` : `<span class="hint">Kept on your review list.</span>`}<button class="btn" id="nextQ"><span>${i + 1 < list.length ? "Next →" : "Finish"}</span></button></div>`;
      if ($("rmNow")) $("rmNow").onclick = () => { unflag(x); $("rmNow").outerHTML = `<span class="hint">Removed from review.</span>` };
      $("nextQ").onclick = () => { quiz.i++; renderQuiz() }; $("nextQ").focus({ preventScroll: true });
    });
  }

  $("lightbox").onclick = () => $("lightbox").hidden = true;
  document.addEventListener("keydown", e => {
    if (!$("lightbox").hidden) { if (e.key === "Escape") $("lightbox").hidden = true; return }
    if (!quiz) return;
    if (/^[1-5]$/.test(e.key)) { const o = $("app").querySelector(`.opt[data-j="${+e.key - 1}"]:not([disabled])`); if (o) o.click() }
    else if (e.key === "Enter" && $("nextQ")) { e.preventDefault(); $("nextQ").click() }
  });
  renderList();
})();
</script>
</body></html>
