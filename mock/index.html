<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mock Exam · Bi 239</title>
<meta name="description" content="A fresh 50- or 100-question Bi 239 practice exam every time, drawn from the drill, with 40% from Homework 3.">
<meta name="theme-color" content="#f5f5f7">
<link rel="stylesheet" href="../assets/drill.css">

<style>
/* Layout: one study column. Start screen → exam (sticky bar with timer + numbered grid, one question card) → results. */
.examhead{display:flex;flex-direction:column;gap:6px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.fact{background:var(--sunk);border-radius:12px;padding:12px 14px}
.fact b{display:block;font:700 26px/1.1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fact span{font-size:13px;color:var(--muted)}
.sizepick{display:flex;flex-direction:column;gap:6px}
.sizelbl{font:600 13px var(--body);color:var(--muted)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;cursor:pointer;font:500 14px var(--body)}
.seg2 button b{font:700 22px var(--display)}
.seg2 button small{font-size:12.5px;color:var(--muted)}
.seg2 button[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.tgl{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font:500 14px var(--body);color:var(--ink);user-select:none}
.tgl input{position:absolute;opacity:0;width:1px;height:1px}
.tgl .sw{position:relative;width:38px;height:22px;border-radius:11px;background:var(--line);transition:background .15s;flex:none}
.tgl .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.tgl input:checked+.sw{background:var(--accent)}
.tgl input:checked+.sw::after{transform:translateX(16px)}
.tgl input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}
.tgl small{display:block;color:var(--muted);font-size:12.5px}
.rules{margin:0;padding-left:18px;color:var(--muted);font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.history{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.history li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.history .pct{font:700 15px var(--mono)}
.history .pass{color:var(--good)} .history .near{color:var(--gold)} .history .low{color:var(--bad)}
.history small{color:var(--muted)}

.ebar{display:flex;flex-direction:column;gap:8px}
.ebar .row1{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.gridbox summary{cursor:pointer;font:600 13px var(--body);color:var(--accent);padding:2px 0 8px}
.gridbox[open] summary{padding-bottom:8px}
.ebar .row1{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.ebar .info{display:flex;flex-wrap:wrap;gap:4px 16px;font:500 13.5px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.ebar .info b{color:var(--ink)}
.ebar .acts{display:flex;gap:6px;flex-wrap:wrap}
.grid100{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px}
.gq{height:20px;border:0;border-radius:4px;background:var(--sq-new,#e7ebf2);font:600 9.5px var(--mono);color:var(--muted);cursor:pointer;padding:0}
.gq.ans{background:var(--accent);color:var(--accent-ink)}
.gq.flag{background:var(--lv-shaky);color:#1b1503}
.gq.cur{outline:2px solid var(--ink);outline-offset:1px}
.gq.right{background:var(--lv-mastered);color:#fff} .gq.wrongq{background:var(--lv-learning);color:#fff}
.legend2{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flagbtn[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--lv-shaky);color:var(--gold)}
.confirm{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font-size:14px}

.score{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.score .big{font:800 56px/1 var(--display);font-variant-numeric:tabular-nums}
.score .big small{font-size:24px;color:var(--muted)}
.verdict{font:700 16px var(--body)}
.verdict.pass{color:var(--good)} .verdict.near{color:var(--gold)} .verdict.low{color:var(--bad)}
.scale{position:relative;height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.scale i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--accent)}
.bysub{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.bysub li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;font-size:14px}
.bysub .sb{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bysub .sb i{display:block;height:100%}
.bysub b{font-weight:600} .bysub span{font:600 13px var(--mono);font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.rev{display:flex;flex-direction:column;gap:12px}
.rcard{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.rcard.bad{border-left:4px solid var(--lv-learning)} .rcard.good{border-left:4px solid var(--lv-mastered)}
.rcard .q{font-size:calc(16.5px * var(--rs))}
.rcard .fig img{max-height:220px}
.mini-opts{display:flex;flex-direction:column;gap:5px;font-size:calc(14px * var(--rs))}
.mini-opts div{padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.mini-opts .r{background:var(--good-soft);border-color:var(--good)}
.mini-opts .w{background:var(--bad-soft);border-color:var(--bad)}
.paused-cover{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.paused-cover>div{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px 26px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:var(--shadow)}
.paused-cover strong{font:800 24px var(--display)}
@media (max-width:560px){.grid100{grid-template-columns:repeat(10,minmax(0,1fr))}.gq{height:24px;font-size:10px}.score .big{font-size:46px}}
</style>

</head><body>
<div class="wrap">
  <header class="examhead">
    <a class="back" href="../index.html">← All drills</a>
    <h1>Mock Exam</h1>
    <p class="sub">50 or 100 random questions from the Plants, Fungi &amp; Signals drill. A brand-new exam every time. 40% come from Homework 3, since the homework covers what the exam tests.</p>
  </header>
  <main id="app"></main>
</div>
<div class="paused-cover" id="pausedCover" hidden><div><strong>Paused</strong><span class="sub">The timer is stopped and the questions are hidden.</span><button class="btn" id="resumeBtn"><span>Resume</span></button></div></div>
<div class="lightbox" id="lightbox" hidden><img id="lbImg" alt=""><button id="lbClose" type="button">Close</button></div>
<script src="../assets/glossary.js"></script>
<script src="bank.js"></script>
<script>
(() => {
  const isProf = src => !/^Practice/i.test(String(src));   // every source except the practice sets came straight from the professor
  // Practice questions were written from the professor's material: say which
  const basedOn = src => { src = String(src); if (!/^Practice/i.test(src)) return ""; return /study guide/i.test(src) ? "the professor's study guide" : /lecture slides/i.test(src) ? "the lecture slides" : /worksheet/i.test(src) ? "the professor's worksheet" : "class material" };
  const basedBadge = src => basedOn(src) ? `<span class="based" title="Written for this site from ${basedOn(src)}">✎ Based on ${basedOn(src)}</span>` : "";
  const whyNot = t => { const d = window.GLOSS && window.GLOSS.look(t); return d ? `<span class="whynot"><b>Why not “${esc(String(t).replace(/<[^>]*>/g, ""))}”?</b> ${esc(d)}</span>` : "" };
  const BANK = window.MOCK_BANK, SIZES = [50, 100], PASS = 90, SIZE_KEY = "bio-mock-size"; const SYN_SHARE = 0.4;   // share of each exam drawn from Homework 3
  let N = 50; try { const v = +localStorage.getItem(SIZE_KEY); if (SIZES.includes(v)) N = v } catch (e) { }
  const KEY = "bio-mock-v1", HIST = "bio-mock-history-v1";
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const shuffle = a => { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.random() * (k + 1) | 0; [a[k], a[j]] = [a[j], a[k]] } return a };
  const byId = Object.fromEntries(BANK.map(q => [q.id, q]));
  const mmss = s => { const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0") };
  const read = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || "null") ?? d } catch (e) { return d } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) { } };
  const TIMER_KEY = "bio-timer"; let showTimer = read(TIMER_KEY, false) === true;   // off by default; shared with the chart page
  const band = p => p >= PASS ? "pass" : p >= 80 ? "near" : "low";

  // Reading settings from the drills apply here too
  try {
    const r = read("bio-reading", null);
    const stacks = { atkinson: ['"Atkinson Hyperlegible Next",system-ui,sans-serif', "https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap"], literata: ['Literata,Georgia,serif', "https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;600;700&display=swap"], system: ['-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif'], plex: ['"IBM Plex Sans",system-ui,sans-serif', "https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"] };
    if (r && stacks[r.font]) { const [st, href] = stacks[r.font]; if (href) { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = href; document.head.appendChild(l) } document.documentElement.style.setProperty("--read", st) }
    if (r && [.9, 1, 1.12, 1.25][r.size]) document.documentElement.style.setProperty("--rs", [.9, 1, 1.12, 1.25][r.size]);
  } catch (e) { }

  // An exam: { items:[{id, opts:[texts]}], ans:[index|null], flag:[bool], pos, ms, started, done, score }
  let E = read(KEY, null), tick = null, runFrom = 0, paused = false, confirmOpen = false, filter = "wrong";
  if (E && !(E.items && E.items.every(it => byId[it.id]))) E = null;   // questions changed since it was saved
  const save = () => write(KEY, E);
  const elapsed = () => Math.round(((E ? E.ms : 0) + (runFrom ? Date.now() - runFrom : 0)) / 1000);
  function startClock() { if (runFrom || paused || !E || E.done) return; runFrom = Date.now(); tick = setInterval(paintBar, 1000) }
  function stopClock() { if (runFrom) { E.ms += Date.now() - runFrom; runFrom = 0 } clearInterval(tick); save() }

  function newExam() {
    const isSyn = q => /^Homework 3/.test(q.src);
    const syn = shuffle(BANK.filter(isSyn)), rest = shuffle(BANK.filter(q => !isSyn(q)));
    const total = Math.min(N, BANK.length), nSyn = Math.min(syn.length, Math.round(total * SYN_SHARE));
    const pick = shuffle([...syn.slice(0, nSyn), ...rest.slice(0, total - nSyn), ...syn.slice(nSyn)].slice(0, total));
    E = { items: pick.map(q => ({ id: q.id, opts: shuffle([q.ok, ...q.wrong]) })), ans: pick.map(() => null), flag: pick.map(() => false), pos: 0, ms: 0, started: Date.now(), done: false };
    save(); paused = false; runFrom = 0; confirmOpen = false; render(true); window.scrollTo({ top: 0 });
  }

  // ----- Start screen
  function renderStart() {
    const hist = read(HIST, []), inProg = E && !E.done;
    const subj = {}; BANK.forEach(q => subj[q.subject] = (subj[q.subject] || 0) + 1);
    $("app").innerHTML = `<section class="panel">
      <div class="facts">
        <div class="fact"><b>${BANK.length}</b><span>in the question pool</span></div>
        <div class="fact"><b>${hist.length}</b><span>exams taken</span></div>
      </div>
      <div class="sizepick"><span class="sizelbl">Exam length</span><div class="seg2" role="radiogroup" aria-label="Exam length">${SIZES.map(n => `<button type="button" role="radio" aria-checked="${n === N}" data-n="${n}"><b>${n}</b> questions<small>${n === 50 ? "A full practice exam" : "Extra-long practice"}</small></button>`).join("")}</div></div>
      <label class="tgl"><input type="checkbox" id="timerTgl"${showTimer ? " checked" : ""}><span class="sw"></span><span>Show a timer<small>Off by default. Turn it on if you want to practice against the clock.</small></span></label>
      <ul class="rules">
        <li>Questions come from every subject (land plants, seed plants, signals, hormones, light, stress and defense, fungi), mixed together at random. 40% are Homework 3 questions.</li>
        <li>Pick an answer and change it as often as you like. Nothing is marked until you submit.</li>
        <li>Flag questions to come back to, and jump anywhere with the numbered grid. Flagged questions are saved to your Review list when you submit.</li>
        <li>Your exam is saved if you leave and come back.</li>
      </ul>
      <div class="nav" style="justify-content:flex-start;gap:10px">
        ${inProg ? `<button class="btn" id="resume"><span>Continue exam (${E.ans.filter(a => a !== null).length}/${E.items.length} answered)</span></button><button class="btn ghost" id="fresh"><span>Start a new exam</span></button>` : `<button class="btn" id="fresh"><span>Start a new exam</span></button>`}
      </div>
      ${inProg ? `<p class="hint">Starting a new exam discards the one in progress.</p>` : ""}
    </section>
    ${hist.length ? `<section class="panel"><b>Your past exams</b><ul class="history">${hist.slice().reverse().slice(0, 10).map(h => `<li><span>${new Date(h.at).toLocaleDateString(undefined, { month: "short", day: "numeric" })} <small>${new Date(h.at).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}${showTimer ? " · " + mmss(h.secs) : ""}</small></span><span class="pct ${band(h.pct)}">${h.pct}%</span><small>${h.right}/${h.total}</small></li>`).join("")}</ul></section>` : ""}`;
    if ($("resume")) $("resume").onclick = () => render(true);
    $("fresh").onclick = () => { if (inProg && !confirm2()) return; newExam() };
    $("timerTgl").onchange = e => { showTimer = e.target.checked; write(TIMER_KEY, showTimer) };
    $("app").querySelectorAll("[data-n]").forEach(b => b.onclick = () => { N = +b.dataset.n; try { localStorage.setItem(SIZE_KEY, N) } catch (e) { } renderStart() });
  }
  let armed = false;
  function confirm2() {   // the viewer can't show confirm() dialogs, so ask in the page: first tap arms, second tap confirms
    const b = $("fresh"); if (armed) { armed = false; return true }
    armed = true; b.querySelector("span").textContent = "Tap again to discard and start new"; setTimeout(() => { armed = false; if (b.isConnected) b.querySelector("span").textContent = "Start a new exam" }, 3000); return false;
  }

  // ----- Taking the exam
  function paintBar() {
    if (!$("ebar")) return;
    const n = E.items.length, answered = E.ans.filter(a => a !== null).length, flagged = E.flag.filter(Boolean).length;
    $("einfo").innerHTML = `<span>Question <b>${E.pos + 1}</b> of ${n}</span><span><b>${answered}</b> answered</span>${flagged ? `<span><b>${flagged}</b> flagged</span>` : ""}${showTimer ? `<span>Time <b>${mmss(elapsed())}</b></span>` : ""}`;
    $("grid").innerHTML = E.items.map((_, k) => `<button class="gq${E.ans[k] !== null ? " ans" : ""}${E.flag[k] ? " flag" : ""}${k === E.pos ? " cur" : ""}" data-k="${k}" aria-label="Question ${k + 1}${E.ans[k] !== null ? ", answered" : ""}${E.flag[k] ? ", flagged" : ""}">${k + 1}</button>`).join("");
  }
  function renderExam() {
    $("app").innerHTML = `<div class="ebar" id="ebar">
        <div class="row1"><div class="info" id="einfo"></div><div class="acts"><button class="chip" id="settingsBtn">← Exam settings</button>${showTimer ? `<button class="chip" id="pauseBtn">Pause</button>` : ""}<button class="chip" id="submitTop">Submit</button></div></div>
        <details class="gridbox" id="gridBox"${innerWidth > 560 ? " open" : ""}><summary>Question grid: jump to any question</summary>
          <div class="grid100" id="grid"></div>
          <div class="legend2" style="margin-top:8px"><span><i style="background:var(--accent)"></i>Answered</span><span><i style="background:var(--lv-shaky)"></i>Flagged</span><span><i style="background:#e7ebf2"></i>Not answered</span></div>
        </details>
      </div>
      <div id="confirmBox"></div>
      <main class="card" id="qcard"></main>`;
    $("grid").onclick = e => { const b = e.target.closest(".gq"); if (b) go(+b.dataset.k) };
    if ($("pauseBtn")) $("pauseBtn").onclick = () => setPaused(true);
    $("settingsBtn").onclick = toSettings;
    $("submitTop").onclick = askSubmit;
    paintBar(); paintQ(); startClock();
  }
  function paintQ() {
    const it = E.items[E.pos], q = byId[it.id], a = E.ans[E.pos], last = E.pos === E.items.length - 1;
    $("qcard").className = "card enter";
    $("qcard").innerHTML = `<div class="meta"><span class="meta-l">${basedBadge(q.src)}${isProf(q.src) ? `<span class="prof" title="This question comes straight from the professor's course materials">★ From the professor</span>` : ""}<span class="origin">Source: ${esc(q.src)}</span><span>${esc(q.subject)}</span></span><span>${E.pos + 1} / ${E.items.length}</span></div>
      <p class="q">${esc(q.q)}</p>
      ${q.img ? `<figure class="fig"><button type="button" class="zoom" data-src="${q.img[0]}" aria-label="Enlarge image"><img src="${q.img[0]}" alt="${esc(q.img[1])}"></button><figcaption>Tap to zoom</figcaption></figure>` : ""}
      <div class="opts">${it.opts.map((t, j) => `<button class="opt${a === j ? " sel" : ""}" data-j="${j}" aria-pressed="${a === j}"><span class="bub">${"ABCDE"[j]}</span><span>${esc(t)}</span></button>`).join("")}</div>
      <div class="nav">
        <button class="btn ghost" id="prev"${E.pos ? "" : " disabled"}><span>← Previous</span></button>
        <button class="chip flagbtn" id="flagBtn" aria-pressed="${E.flag[E.pos]}">${E.flag[E.pos] ? "⚑ Flagged" : "⚑ Flag for review"}</button>
        <button class="btn" id="next"><span>${last ? "Review &amp; submit" : "Next →"}</span></button>
      </div>`;
    $("qcard").querySelectorAll(".opt").forEach(b => b.onclick = () => choose(+b.dataset.j));
    $("prev").onclick = () => go(E.pos - 1);
    $("next").onclick = () => last ? askSubmit() : go(E.pos + 1);
    $("flagBtn").onclick = () => { E.flag[E.pos] = !E.flag[E.pos]; save(); paintBar(); paintQ() };
    const z = $("qcard").querySelector(".zoom"); if (z) z.onclick = () => { $("lbImg").src = z.dataset.src; $("lightbox").hidden = false };
  }
  function choose(j) {
    E.ans[E.pos] = E.ans[E.pos] === j ? null : j; save();
    $("qcard").querySelectorAll(".opt").forEach(b => { const on = +b.dataset.j === E.ans[E.pos]; b.classList.toggle("sel", on); b.setAttribute("aria-pressed", on) });
    paintBar();
  }
  function go(k) { if (k < 0 || k >= E.items.length) return; E.pos = k; save(); paintBar(); paintQ(); if (innerWidth <= 560 && $("gridBox")) $("gridBox").open = false; $("qcard").scrollIntoView({ block: "start" }); window.scrollBy(0, -60) }
  function askSubmit() {
    const left = E.ans.filter(a => a === null).length, flagged = E.flag.filter(Boolean).length;
    if (confirmOpen) return submit();
    confirmOpen = true;
    $("confirmBox").innerHTML = `<div class="confirm"><span>${left ? `<b>${left} unanswered</b> (they count as wrong).` : `All ${E.items.length} answered.`}${flagged ? ` ${flagged} still flagged.` : ""} Submit now?</span><span style="display:flex;gap:8px"><button class="btn ghost" id="keep"><span>Keep working</span></button><button class="btn" id="doSubmit"><span>Submit exam</span></button></span></div>`;
    $("keep").onclick = () => { confirmOpen = false; $("confirmBox").innerHTML = "" };
    $("doSubmit").onclick = submit;
    if (left) { const k = E.ans.findIndex(a => a === null); if (k >= 0 && k !== E.pos) { E.pos = k; paintBar(); paintQ() } }
    $("confirmBox").scrollIntoView({ block: "center" });
  }
  function submit() {
    stopClock(); confirmOpen = false;
    const right = E.items.reduce((n, it, k) => n + (E.ans[k] !== null && it.opts[E.ans[k]] === byId[it.id].ok ? 1 : 0), 0);
    E.done = true; E.score = right; E.secs = elapsed(); save();
    // Questions flagged in this exam go to the Review list (the drill they came from marks them "for review")
    const KEYS = { drill: "bio-u3-progress-v1" };
    E.items.forEach((it, k) => { if (!E.flag[k]) return; const [d, id] = it.id.split(":"); const key = KEYS[d]; if (!key) return;
      const s = read(key, null) || { v: 2 }; s.mark = s.mark || {}; s.mark[id] = { m: "review", t: Date.now() }; s.updatedAt = Date.now(); write(key, s) });
    const hist = read(HIST, []); hist.push({ at: Date.now(), right, total: E.items.length, pct: Math.round(right / E.items.length * 100), secs: E.secs }); write(HIST, hist.slice(-50));
    filter = "wrong"; render(); window.scrollTo({ top: 0 });
  }

  // ----- Results
  function renderResults() {
    const n = E.items.length, pct = Math.round(E.score / n * 100);
    const rows = E.items.map((it, k) => { const q = byId[it.id], a = E.ans[k]; return { k, q, it, a, ok: a !== null && it.opts[a] === q.ok } });
    const subj = {}; rows.forEach(r => { const s = subj[r.q.subject] = subj[r.q.subject] || { n: 0, r: 0 }; s.n++; if (r.ok) s.r++ });
    const subs = Object.entries(subj).sort((x, y) => x[1].r / x[1].n - y[1].r / y[1].n);
    const hist = read(HIST, []), prev = hist.length > 1 ? hist[hist.length - 2] : null;
    const list = rows.filter(r => filter === "all" || (filter === "wrong" ? !r.ok : E.flag[r.k]));
    $("app").innerHTML = `<section class="panel">
        <div class="score"><div class="big">${E.score}<small>/${n}</small></div>
          <div><div class="verdict ${band(pct)}">${pct}% correct</div><div class="sub">${[showTimer ? "Time " + mmss(E.secs || 0) : "", prev ? `Last exam ${prev.pct}%` : ""].filter(Boolean).join(" · ")}</div></div></div>
        <div class="scale" role="img" aria-label="Score ${pct}%"><i style="width:${pct}%;background:var(--lv-${pct >= PASS ? "mastered" : pct >= 80 ? "shaky" : "learning"})"></i></div>
        <div class="nav" style="justify-content:flex-start;gap:10px"><button class="btn" id="again"><span>Take a new exam</span></button><button class="btn ghost" id="toSet"><span>Exam settings</span></button><a class="btn ghost" href="../drill/index.html#progress" style="text-decoration:none"><span>Practice in the drills</span></a></div>
      </section>
      <section class="panel"><b>By subject <span class="hint">weakest first</span></b>
        <ul class="bysub">${subs.map(([s, v]) => { const p = Math.round(v.r / v.n * 100); return `<li><b>${esc(s)}</b><span>${v.r}/${v.n} · ${p}%</span><span class="sb"><i style="width:${p}%;background:var(--lv-${p >= PASS ? "mastered" : p >= 80 ? "shaky" : "learning"})"></i></span></li>` }).join("")}</ul>
      </section>
      <section class="panel"><b>Review your answers</b>
        <div class="grid100" id="rgrid">${rows.map(r => `<button class="gq ${r.ok ? "right" : "wrongq"}" data-k="${r.k}" aria-label="Question ${r.k + 1}: ${r.ok ? "right" : "wrong"}">${r.k + 1}</button>`).join("")}</div>
        <div class="filters"><button class="chip" data-f="wrong" aria-pressed="${filter === "wrong"}">Missed (${rows.filter(r => !r.ok).length})</button><button class="chip" data-f="flag" aria-pressed="${filter === "flag"}">Flagged (${E.flag.filter(Boolean).length})</button>${E.flag.some(Boolean) ? `<a class="chip" href="../review/index.html" style="text-decoration:none">Flagged ones are in your Review list →</a>` : ""}<button class="chip" data-f="all" aria-pressed="${filter === "all"}">All ${n}</button></div>
        <div class="rev">${list.length ? list.map(r => `<article class="rcard ${r.ok ? "good" : "bad"}" id="r${r.k}">
            <div class="meta"><span class="meta-l">${basedBadge(r.q.src)}${isProf(r.q.src) ? `<span class="prof" title="This question comes straight from the professor's course materials">★ From the professor</span>` : ""}<span class="origin">Source: ${esc(r.q.src)}</span><span>${esc(r.q.subject)}</span></span><span>Q${r.k + 1}</span></div>
            <p class="q">${esc(r.q.q)}</p>
            ${r.q.img ? `<figure class="fig"><img src="${r.q.img[0]}" alt="${esc(r.q.img[1])}"></figure>` : ""}
            <div class="mini-opts">${r.it.opts.map((t, j) => `<div class="${t === r.q.ok ? "r" : j === r.a ? "w" : ""}">${"ABCDE"[j]}. ${esc(t)}${t === r.q.ok ? " ✓" : j === r.a ? " (your answer)" : ""}</div>`).join("")}${r.a === null ? `<div class="w">Not answered</div>` : ""}</div>
            ${r.q.ex || (!r.ok && r.a !== null) ? `<div class="explain ${r.ok ? "good" : "bad"}">${r.q.ex ? `<span class="exwhy"><b>Why:</b> ${esc(r.q.ex)}</span>` : ""}${!r.ok && r.a !== null ? whyNot(r.it.opts[r.a]) : ""}</div>` : ""}
          </article>`).join("") : `<p class="hint">Nothing here.</p>`}</div>
      </section>`;
    $("again").onclick = newExam;
    $("toSet").onclick = () => { E = null; try { localStorage.removeItem(KEY) } catch (e) { } renderStart(); window.scrollTo({ top: 0 }) };
    $("app").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; renderResults() });
    $("rgrid").onclick = e => { const b = e.target.closest(".gq"); if (!b) return; const k = +b.dataset.k; if (!$("r" + k)) { filter = "all"; renderResults() } $("r" + k).scrollIntoView({ block: "start", behavior: "smooth" }) };
  }

  // Back to the setup screen: the timer stops and the exam in progress is kept (Continue exam picks it up).
  function toSettings() { stopClock(); paused = false; confirmOpen = false; renderStart(); window.scrollTo({ top: 0 }) }

  // ----- Pause, lightbox, keyboard, leaving
  function setPaused(on) { paused = on; $("pausedCover").hidden = !on; if (on) stopClock(); else startClock(); paintBar() }
  $("resumeBtn").onclick = () => setPaused(false);
  $("lightbox").onclick = () => $("lightbox").hidden = true;
  document.addEventListener("visibilitychange", () => { if (showTimer && document.hidden && E && !E.done && $("ebar")) setPaused(true) });
  window.addEventListener("pagehide", () => { if (E && !E.done && runFrom) stopClock() });
  document.addEventListener("keydown", e => {
    if (!$("lightbox").hidden) { if (e.key === "Escape") $("lightbox").hidden = true; return }
    if (!$("ebar") || paused) return;
    if (/^[1-5]$/.test(e.key)) { const j = +e.key - 1; if (j < E.items[E.pos].opts.length) choose(j) }
    else if (e.key === "ArrowRight") go(E.pos + 1); else if (e.key === "ArrowLeft") go(E.pos - 1);
    else if (e.key.toLowerCase() === "f") $("flagBtn").click();
  });

  function render(resume) {
    if (E && E.done) return renderResults();
    if (E && resume) return renderExam();
    renderStart();
  }
  render();
})();
</script>
</body></html>
