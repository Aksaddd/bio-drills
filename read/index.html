.pl-conf{position:fixed;z-index:200;width:8px;height:12px;border-radius:2px;pointer-events:none;animation:plConf 1.2s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes plConf{to{transform:translate(var(--dx),calc(var(--dy) + 260px)) rotate(var(--r));opacity:0}}
[data-theme="dark"] .pl-zoom,[data-theme="dark"] .pl-lab,[data-theme="dark"] .pl-stage{background:#fff}
</style>
</head><body>
<div class="wrap" id="app">
  <header>
    <a class="back" href="../index.html" id="backLink">← All drills</a>
    <div class="titlerow"><h1 id="title">Read &amp; Learn</h1></div>
  </header>
  <div id="view"></div>
</div>
<div class="lightbox" id="lightbox" hidden><img id="lbImg" alt=""><button id="lbClose" type="button">Close</button></div>
<script src="../assets/glossary.js"></script>
<script src="../drill/shared.js"></script>
<script src="../drill/questions.js"></script>
<script src="chapters.js"></script>
<script src="play.js"></script>
<script src="notes.js"></script>
<script>
// Read & Learn: read a short passage, then answer the questions about it right there, then keep reading.
// Answers are saved here (bio-read-v1) and also recorded in the drill's progress, so the drill knows what you've learned.
(() => {
  const B = window.BANK, R = window.READ, KEY = "bio-read-v1", $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const plain = s => String(s).replace(/<[^>]*>/g, "");
  const NEED = 3;
  const EMO = { land: "🌿", vascular: "🌴", seed: "🌸", signals: "🌱", hormones: "🍅", light: "🌙", stress: "🌵", fungi: "🍄" };
  const acts = c => c.sections.reduce((n, s) => n + (s.play || []).filter(b => b.t !== "fig").length, 0);   // questions to answer in a section before "Keep reading" (the rest are bonus)
  let st = {}; try { st = JSON.parse(localStorage.getItem(KEY) || "{}") || {} } catch (e) { }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)) } catch (e) { } };
  const chState = c => st[c.id] || (st[c.id] = { at: 0, a: {} });
  const need = s => Math.min(NEED, s.qs.length);
  const answeredIn = (c, s) => s.qs.filter(id => chState(c).a[id]).length;
  const totalQs = c => c.sections.reduce((n, s) => n + s.qs.length, 0);
  const words = c => c.sections.reduce((n, s) => n + plain(s.html).split(/\s+/).length, 0);
  function chProgress(c) {
    const S = chState(c), done = Math.min(S.at + (S.finished ? 1 : 0), c.sections.length), a = Object.values(S.a);
    return { done, pct: S.finished ? 100 : Math.round(100 * done / c.sections.length), right: a.filter(x => x.ok).length, answered: a.length };
  }
  const CUR = {}, REDO = new Set();   // REDO: answered questions the student chose to try again   // the option order shown for each open question
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[a[i], a[j]] = [a[j], a[i]] } return a };

  // ---- the drill's progress: answers here count there too
  function drillRecord(id, good) {
    let d = null; try { d = JSON.parse(localStorage.getItem(B.storageKey) || "null") } catch (e) { }
    if (!d || d.v !== 2) d = { v: 2, hist: {}, stats: {}, missed: [], days: {}, rounds: {}, mark: {}, log: {} };
    d.hist = d.hist || {}; d.stats = d.stats || {}; d.days = d.days || {}; d.missed = d.missed || [];
    const prev = (d.stats[id] || [0, 0]).slice(), prevHist = d.hist[id];
    d.hist[id] = good ? 1 : 0; d.stats[id] = [prev[0] + 1, prev[1] + (good ? 1 : 0)];
    const m = new Set(d.missed); good ? m.delete(id) : m.add(id); d.missed = [...m];
    const t = new Date(), dk = t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
    d.days[dk] = (d.days[dk] | 0) + 1; d.updatedAt = Date.now();
    try { localStorage.setItem(B.storageKey, JSON.stringify(d)) } catch (e) { }
    return { prev, prevHist };
  }

  // ---- badges: finishing a chapter earns its badge (drawn in assets/wardrobe.js), which can be pinned on Dexter
  const badgeOf = c => window.BioWardrobe && window.BioWardrobe.byId["badge-" + c.id];
  const badgeSVG = (c, cls) => { const b = badgeOf(c); return b ? `<svg class="${cls || ""}" viewBox="-11 -11 22 22" aria-hidden="true">${b.big}</svg>` : EMO[c.id] };
  function badgeStrip() {
    const n = R.filter(c => chState(c).finished).length;
    return `<button type="button" class="rd-badges" id="openBadges" aria-label="Badge case: ${n} of ${R.length} badges earned"><span class="rd-btitle"><b>Badge Case</b><small>${n} of ${R.length} · finish a chapter to earn its badge</small></span>
      <span class="rd-brow">${R.map(c => `<span class="rd-b${chState(c).finished ? " got" : ""}" title="${esc(chState(c).finished ? (badgeOf(c) || {}).name || c.title : "Locked: " + c.title)}">${badgeSVG(c)}</span>`).join("")}</span></button>`;
  }
  // ---- library
  function library() {
    document.title = "Bi 239 · Read & Learn"; $("title").textContent = "Read & Learn";
    $("backLink").textContent = "← All drills"; $("backLink").href = "../index.html";
    const next = R.find(c => !chState(c).finished) || R[0];
    $("view").innerHTML = `<p class="rd-lead">Read the course one short passage at a time. After each passage, answer a few questions about what you just read, then keep reading. Start here, before the drills.</p>
      ${badgeStrip()}
      <button type="button" class="rd-book" id="openBook"><span>🗒</span><span><b>My notebook</b><small>${window.ReadNotes && window.ReadNotes.countAll() ? window.ReadNotes.countAll() + " highlights and notes" : "Select text in any passage to highlight it or add a note"}</small></span><i>›</i></button>
      <div class="rd-how"><b>How it works:</b> the figures come straight from the lecture slides, and every passage has something to do: label a diagram, put steps in order, match, sort, or run one of the lecture's experiments yourself. A perfect first try earns Dexter XP. <b>Double-tap any science word</b> to see what it means and its Greek and Latin roots, and <b>press and hold</b> (or drag across) text to highlight it or add a note. Then answer ${NEED} questions to unlock the next passage; any extra ones are bonus practice. Your answers count toward the Multiple-Choice Drill and earn Dexter XP and gold like any other answer.</div>
      <div class="rd-list">${R.map((c, i) => {
        const p = chProgress(c), S = chState(c), mins = Math.max(2, Math.round(words(c) / 200));
        const go = S.finished ? "Read again" : p.answered || S.at ? "Continue" : c === next ? "Start" : "Read";
        return `<a class="rd-ch${S.finished ? " done" : ""}" href="#${c.id}"><span class="rd-emo" aria-hidden="true">${S.finished && badgeOf(c) ? badgeSVG(c) : EMO[c.id] || "📖"}</span>
          <span><h3>${esc(c.title)}</h3><p>${c.ch} · ${c.sections.length} passages · ${acts(c)} activities · ${totalQs(c)} questions · ~${mins} min${p.answered ? ` · ${p.right} of ${p.answered} right` : ""}</p><span class="rd-bar"><i style="width:${p.pct}%"></i></span></span>
          <span class="rd-go">${go} ›</span></a>`;
      }).join("")}</div>`;
    const ob = $("openBadges"); if (ob) ob.onclick = () => window.BioBuddy && window.BioBuddy.openBadges();
    const nb = $("openBook"); if (nb) nb.onclick = () => window.ReadNotes.notebook();
  }

  // ---- one question, inline
  function qHTML(c, id, active) {
    const x = B.q[id], A = chState(c).a[id];
    const img = x.img ? `<figure class="fig"><button type="button" class="zoom" data-src="../drill/${esc(x.img[0])}" data-alt="${esc(x.img[1])}" aria-label="Enlarge image: ${esc(x.img[1])}"><img src="../drill/${esc(x.img[0])}" alt="${esc(x.img[1])}"></button><figcaption>Tap to zoom</figcaption></figure>` : "";
    if (A && !REDO.has(id)) {
      const why = window.GLOSS && !A.ok ? window.GLOSS.look(A.p) : null;
      return `<div class="rd-q card past" data-id="${id}"><p class="q">${x.q}</p>${img}
        <div class="opts">${A.o.map((t, j) => `<button class="opt${t === x.ok ? " right" : ""}${t === A.p ? " picked" : ""}${t === A.p && !A.ok ? " wrong" : ""}" disabled><span class="bub">${"ABCDE"[j]}</span><span>${t}</span></button>`).join("")}</div>
        <div class="explain ${A.ok ? "good" : "bad"}"><strong>${A.ok ? (A.n > 1 ? `Correct on try ${A.n}!` : "Correct!") : "Not quite. The answer is: " + x.ok}</strong>${x.ex ? `<span class="exwhy"><b>Why:</b> ${x.ex}</span>` : ""}${why ? `<span class="whynot"><b>Why not “${esc(plain(A.p))}”?</b> ${esc(why)}</span>` : ""}</div>
        <div class="rd-retry"><button type="button" class="chip" data-retry="${id}">↻ Try again</button></div></div>`;
    }
    if (!active && !REDO.has(id)) return "";
    if (REDO.has(id) && !CUR[id + "#r"]) { CUR[id + "#r"] = 1; delete CUR[id] }   // fresh shuffle for the retry
    const opts = CUR[id] || (CUR[id] = shuffle([x.ok, ...x.wrong]));
    return `<div class="rd-q card" data-id="${id}"><p class="q">${x.q}</p>${img}
      <div class="opts">${opts.map((t, j) => `<button class="opt" data-t="${j}"><span class="bub">${"ABCDE"[j]}</span><span>${t}</span></button>`).join("")}</div></div>`;
  }
  function checkHTML(c, s, si) {
    const S = chState(c), done = answeredIn(c, s), n = s.qs.length, nextId = s.qs.find(id => !S.a[id]);
    const unlocked = done >= need(s), last = si === c.sections.length - 1;
    let more = "";
    if (si === S.at && !S.finished) {
      if (unlocked) more = `<div class="rd-more"><button class="btn" data-act="next">${last ? "Finish the chapter" : "Keep reading ↓"}</button>${nextId ? `<span class="rd-skip" style="text-decoration:none">or answer the bonus question${n - done > 1 ? `s (${n - done} left)` : ""} first</span>` : ""}</div>`;
      else more = `<div class="rd-more"><button class="rd-skip" data-act="skip">Skip the questions and keep reading</button></div>`;
    } else if (nextId && unlocked) more = "";
    return `<div class="rd-check"><div class="rd-cap">✎ Check yourself<span>${done} of ${n} answered${n > need(s) ? ` · ${need(s)} to keep reading` : ""}</span></div>
      ${s.qs.map(id => qHTML(c, id, id === nextId)).join("")}${more}</div>`;
  }
  function chapter(c) {
    const ci = R.indexOf(c), S = chState(c);
    document.title = "Read · " + c.title; $("title").textContent = c.title;
    $("backLink").textContent = "← All chapters"; $("backLink").href = "#";
    const p = chProgress(c), shown = c.sections.slice(0, S.finished ? c.sections.length : S.at + 1);
    const nextC = R[ci + 1];
    $("view").innerHTML = `<div class="rd-head"><p class="rd-kicker">${c.ch} · Chapter ${ci + 1} of ${R.length}</p><p class="rd-lead">${c.intro}</p></div>
      <div class="rd-sticky"><span>Passage ${Math.min(S.at + 1, c.sections.length)} of ${c.sections.length}</span><span class="rd-bar"><i style="width:${p.pct}%"></i></span><span class="rd-score-mini">${p.right}/${p.answered} right</span><button type="button" class="rd-tool" id="anBook" title="Your highlights and notes in this chapter">🗒<span>Notes</span><b id="anCount"></b></button></div>
      ${shown.map((s, i) => `<section class="rd-sec" id="sec${i}"><p class="rd-step">Passage ${i + 1}</p><h2>${s.h}</h2><div class="rd-prose">${s.html}</div>${(s.play || []).map((b, j) => window.ReadPlay.html(b, i + "-" + j, (S.w || {})[i + "-" + j])).join("")}${checkHTML(c, s, i)}</section>`).join("")}
      ${S.finished ? endHTML(c, nextC, ci) : S.at + 1 < c.sections.length ? `<div class="rd-locked">🔒 ${c.sections.length - S.at - 1} more passage${c.sections.length - S.at - 1 > 1 ? "s" : ""}: answer the questions above to keep reading</div>` : ""}`;
    wire(c);
    if (window.ReadNotes) {
      window.ReadNotes.apply(c);
      $("anBook").onclick = () => window.ReadNotes.notebook(c.id);
    }
  }
  function endHTML(c, nextC, ci) {
    const p = chProgress(c), ids = c.sections.flatMap(s => s.qs), missedHere = ids.filter(id => chState(c).a[id] && !chState(c).a[id].ok).length;
    return `<section class="rd-sec rd-end card" id="end"><p class="rd-step">Chapter complete · badge earned</p>${badgeSVG(c, "rd-endbadge")}<h2>${esc((badgeOf(c) || {}).name || c.title)}</h2><p class="rd-lead" style="margin-top:-6px">${esc(c.title)}</p>
      ${p.answered ? `<div class="rd-score">${Math.round(100 * p.right / p.answered)}%</div><p class="rd-lead">${p.right} of ${p.answered} right${missedHere ? ` · ${missedHere} to review in the drill's Missed tab` : ""}</p>` : `<p class="rd-lead">You read the whole chapter. Try its questions in the drill next.</p>`}
      <div class="rd-more">${nextC ? `<a class="btn" href="#${nextC.id}">Next: ${esc(nextC.title)} ›</a>` : `<a class="btn" href="../mock/index.html">Take a Mock Exam ›</a>`}<a class="btn ghost" href="../drill/index.html">Practice in the drill</a><button class="btn ghost" data-act="badges">Badge Case</button><button class="btn ghost" data-act="reset">Read it again</button></div></section>`;
  }
  function wire(c) {
    const S = chState(c), view = $("view");
    c.sections.forEach((s, i) => (s.play || []).forEach((b, j) => {
      const key = i + "-" + j, el = view.querySelector(`.pl[data-k="${key}"]`); if (!el) return;
      window.ReadPlay.wire(el, b, key, (node, perfect, note, quiet) => {
        S.w = S.w || {}; const first = !S.w[key];
        if (first || perfect && !S.w[key].perfect) S.w[key] = { perfect, t: Date.now() }; save();
        const fresh = document.querySelector(`.pl[data-k="${key}"]`) || node;
        if (!quiet) window.ReadPlay.confetti(fresh);
        if (perfect && first) window.dispatchEvent(new CustomEvent("bio:correct", { detail: { kind: "root", from: "read", missed: false } }));
        setTimeout(() => { const n = document.querySelector(`.pl[data-k="${key}"]`); if (!n) return; n.outerHTML = window.ReadPlay.html(b, key, S.w[key]); wireOne(c, i, j) }, quiet ? 0 : 1500);
      });
    }));
    wireQs(c, view);
    view.querySelectorAll("[data-act]").forEach(b => b.onclick = () => act(c, b.dataset.act));
    view.querySelectorAll(".rd-q .zoom").forEach(z => z.onclick = () => { $("lbImg").src = z.dataset.src; $("lbImg").alt = z.dataset.alt; $("lightbox").hidden = false });
  }
  function wireOne(c, i, j) {   // re-wire a single activity after it re-renders in its finished state
    const S = chState(c), b = c.sections[i].play[j], key = i + "-" + j, el = document.querySelector(`.pl[data-k="${key}"]`);
    if (el) window.ReadPlay.wire(el, b, key, (node, perfect) => { if (perfect && !S.w[key].perfect) { S.w[key] = { perfect, t: Date.now() }; save() } window.ReadPlay.confetti(node) });
  }
  function act(c, a) {
    const S = chState(c);
    if (a === "badges") { window.BioBuddy && window.BioBuddy.openBadges(); return }
    if (a === "reset") { st[c.id] = { at: 0, a: {}, w: S.w }; save(); chapter(c); scrollTo(0, 0); return }
    if (S.at >= c.sections.length - 1) { const first = !S.finished; S.finished = true; save(); chapter(c); go("end"); if (first) setTimeout(() => window.dispatchEvent(new CustomEvent("bio:badge", { detail: { chapter: c.id } })), 700); return }
    S.at++; save(); chapter(c); go("sec" + S.at);
  }
  function refreshCheck(c, si) {   // after an answer, redraw only that passage's questions (activities keep their state)
    const sec = $("sec" + si); if (!sec) return chapter(c);
    const box = sec.querySelector(".rd-check"), t = document.createElement("div"); t.innerHTML = checkHTML(c, c.sections[si], si);
    box.replaceWith(t.firstElementChild);
    const p = chProgress(c), bar = document.querySelector(".rd-sticky");
    if (bar) { bar.querySelector(".rd-bar i").style.width = p.pct + "%"; bar.querySelector(".rd-score-mini").textContent = `${p.right}/${p.answered} right` }
    const nb = sec.querySelector(".rd-check"); wireQs(c, nb);
    nb.querySelectorAll("[data-act]").forEach(b => b.onclick = () => act(c, b.dataset.act));
    nb.querySelectorAll(".zoom").forEach(z => z.onclick = () => { $("lbImg").src = z.dataset.src; $("lbImg").alt = z.dataset.alt; $("lightbox").hidden = false });
  }
  function wireQs(c, root) {
    const S = chState(c), view = $("view");
    root.querySelectorAll("[data-retry]").forEach(b => b.onclick = () => {
      const id = b.dataset.retry; REDO.add(id); const si = +b.closest(".rd-sec").id.slice(3); refreshCheck(c, si);
      const nb = view.querySelector(`.rd-q[data-id="${id}"]`); if (nb) nb.scrollIntoView({ block: "center", behavior: "smooth" });
    });
    root.querySelectorAll(".rd-q:not(.past) .opt").forEach(b => b.onclick = () => {
      const box = b.closest(".rd-q"), id = box.dataset.id, x = B.q[id];
      const o = CUR[id], p = o[+b.dataset.t], good = p === x.ok;
      box.querySelectorAll(".opt").forEach(e => { e.disabled = true; if (o[+e.dataset.t] === x.ok) e.classList.add("right") });
      b.classList.add("picked", good ? "pop" : "shake"); if (!good) b.classList.add("wrong");
      const prevA = S.a[id]; REDO.delete(id); delete CUR[id + "#r"];
      S.a[id] = { ok: good, p, o, n: prevA ? (prevA.n || 1) + 1 : 1 }; save();
      const h = drillRecord(id, good);
      window.dispatchEvent(new CustomEvent(good ? "bio:correct" : "bio:wrong", { detail: { kind: "drill", from: B.storageKey, id, q: x, prev: h.prev, prevHist: h.prevHist } }));
      const y = box.getBoundingClientRect().top;
      const si = +box.closest(".rd-sec").id.slice(3);
      setTimeout(() => { refreshCheck(c, si); const nb = view.querySelector(`.rd-q[data-id="${id}"]`); if (nb) scrollBy(0, nb.getBoundingClientRect().top - y) }, 450);
    });
  }
  const go = id => requestAnimationFrame(() => { const e = $(id); if (e) e.scrollIntoView({ behavior: "smooth", block: "start" }) });
  $("lbClose").onclick = () => $("lightbox").hidden = true; $("lightbox").onclick = e => { if (e.target.id === "lightbox") $("lightbox").hidden = true };

  function route() {
    const c = R.find(x => x.id === location.hash.slice(1));
    if (c) { chapter(c); const S = chState(c); if (S.at && !S.finished) go("sec" + S.at); else scrollTo(0, 0) } else { library(); scrollTo(0, 0) }
  }
  addEventListener("hashchange", route); route();
})();
</script>
</body></html>
