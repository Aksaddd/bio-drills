<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bi 239 · Read &amp; Learn</title>
<meta name="description" content="Bi 239 reading: short passages on land plants, seed plants, plant signals and hormones, light, stress and defense, and fungi, with questions built into the reading.">
<meta name="theme-color" content="#f5f5f7">
<link rel="stylesheet" href="../assets/drill.css">
<script src="../assets/settings.js"></script>
<script src="../assets/xp.js"></script>
<script src="../assets/wardrobe.js"></script>
<script src="../assets/buddy.js"></script>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
.rd-lead{color:var(--muted);margin:2px 0 0;font:400 17px/1.45 var(--body)}
.rd-list{display:flex;flex-direction:column;gap:10px}
.rd-ch{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:var(--paper);border-radius:var(--radius);padding:16px 18px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .12s}
.rd-ch:hover{transform:translateY(-1px)}
.rd-num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:700 16px var(--body)}
.rd-ch.done .rd-num{background:var(--good-soft);color:var(--good)}
.rd-ch h3{margin:0;font:600 17px/1.25 var(--display);letter-spacing:-.01em}
.rd-ch p{margin:2px 0 6px;color:var(--muted);font:400 13.5px/1.35 var(--body)}
.rd-bar{height:5px;border-radius:3px;background:var(--fill);overflow:hidden}.rd-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.rd-ch.done .rd-bar i{background:var(--good)}
.rd-go{font:600 15px var(--body);color:var(--accent);white-space:nowrap}
.rd-how{background:var(--paper);border-radius:var(--radius);padding:16px 18px;font:400 15px/1.5 var(--body);color:var(--muted);box-shadow:var(--shadow)}
.rd-how b{color:var(--ink)}
.rd-head .rd-kicker{font:600 13px var(--body);color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.rd-sticky{position:sticky;top:0;z-index:20;margin:0 -4px;padding:8px 4px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);display:flex;align-items:center;gap:12px;font:500 13px var(--body);color:var(--muted)}
.rd-sticky .rd-bar{flex:1}
.rd-sec{background:var(--paper);border-radius:var(--radius);padding:22px 22px 18px;box-shadow:var(--shadow);animation:rise .35s ease;scroll-margin-top:56px}
.rd-sec h2{font:700 calc(21px * var(--rs))/1.25 var(--display);letter-spacing:-.015em;margin:0 0 10px}
.rd-sec .rd-step{font:600 12px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px}
.rd-prose{font:400 calc(17px * var(--rs))/1.62 var(--read);color:var(--ink)}
.rd-prose p{margin:0 0 12px}.rd-prose ul,.rd-prose ol{margin:0 0 12px;padding-left:22px}.rd-prose li{margin:4px 0}
.rd-prose b{font-weight:650;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 16%,transparent) 0)}
.rd-t{border-collapse:collapse;width:100%;font-size:calc(15px * var(--rs));margin:4px 0 12px}
.rd-t th,.rd-t td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}.rd-t th{font-weight:650}
.rd-check{margin-top:16px;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.rd-check>.rd-cap{display:flex;align-items:center;gap:8px;font:600 13px var(--body);color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.rd-check>.rd-cap span{margin-left:auto;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.rd-q{display:flex;flex-direction:column;gap:10px;border:0;box-shadow:none;padding:0;background:transparent;border-radius:0}
.rd-q .q{font-size:calc(17.5px * var(--rs))}
.rd-q.past{opacity:.92}
.rd-q+.rd-q{border-top:1px dashed var(--line);padding-top:14px}
.rd-more{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rd-skip{border:0;background:none;color:var(--muted);font:500 14px var(--body);cursor:pointer;text-decoration:underline;padding:6px 2px}
.rd-locked{border:1.5px dashed var(--line);border-radius:var(--radius);padding:18px;text-align:center;color:var(--muted);font:500 15px var(--body)}
.rd-end{text-align:center;align-items:center}
.rd-end h2{font:700 24px var(--display);margin:0}
.rd-score{font:800 44px var(--display);letter-spacing:-.03em;color:var(--good)}
.rd-end .rd-more{justify-content:center}
.rd-nav{display:flex;justify-content:space-between;gap:10px}
</style>
</head><body>
<div class="wrap" id="app">
  <header>
    <a class="back" href="../index.html" id="backLink">← All drills</a>
    <div class="titlerow"><h1 id="title">Read &amp; Learn</h1></div>
  </header>
  <div id="view"></div>
</div>
<div class="lightbox" id="lightbox" hidden><img id="lbImg" alt=""><button id="lbClose" type="button">Close</button></div>
<script src="../assets/glossary.js"></script>
<script src="../drill/shared.js"></script>
<script src="../drill/questions.js"></script>
<script src="chapters.js"></script>
<script>
// Read & Learn: read a short passage, then answer the questions about it right there, then keep reading.
// Answers are saved here (bio-read-v1) and also recorded in the drill's progress, so the drill knows what you've learned.
(() => {
  const B = window.BANK, R = window.READ, KEY = "bio-read-v1", $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const plain = s => String(s).replace(/<[^>]*>/g, "");
  const NEED = 3;   // questions to answer in a section before "Keep reading" (the rest are bonus)
  let st = {}; try { st = JSON.parse(localStorage.getItem(KEY) || "{}") || {} } catch (e) { }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)) } catch (e) { } };
  const chState = c => st[c.id] || (st[c.id] = { at: 0, a: {} });
  const need = s => Math.min(NEED, s.qs.length);
  const answeredIn = (c, s) => s.qs.filter(id => chState(c).a[id]).length;
  const totalQs = c => c.sections.reduce((n, s) => n + s.qs.length, 0);
  const words = c => c.sections.reduce((n, s) => n + plain(s.html).split(/\s+/).length, 0);
  function chProgress(c) {
    const S = chState(c), done = Math.min(S.at + (S.finished ? 1 : 0), c.sections.length), a = Object.values(S.a);
    return { done, pct: S.finished ? 100 : Math.round(100 * done / c.sections.length), right: a.filter(x => x.ok).length, answered: a.length };
  }
  const CUR = {};   // the option order shown for each open question
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[a[i], a[j]] = [a[j], a[i]] } return a };

  // ---- the drill's progress: answers here count there too
  function drillRecord(id, good) {
    let d = null; try { d = JSON.parse(localStorage.getItem(B.storageKey) || "null") } catch (e) { }
    if (!d || d.v !== 2) d = { v: 2, hist: {}, stats: {}, missed: [], days: {}, rounds: {}, mark: {}, log: {} };
    d.hist = d.hist || {}; d.stats = d.stats || {}; d.days = d.days || {}; d.missed = d.missed || [];
    const prev = (d.stats[id] || [0, 0]).slice(), prevHist = d.hist[id];
    d.hist[id] = good ? 1 : 0; d.stats[id] = [prev[0] + 1, prev[1] + (good ? 1 : 0)];
    const m = new Set(d.missed); good ? m.delete(id) : m.add(id); d.missed = [...m];
    const t = new Date(), dk = t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
    d.days[dk] = (d.days[dk] | 0) + 1; d.updatedAt = Date.now();
    try { localStorage.setItem(B.storageKey, JSON.stringify(d)) } catch (e) { }
    return { prev, prevHist };
  }

  // ---- library
  function library() {
    document.title = "Bi 239 · Read & Learn"; $("title").textContent = "Read & Learn";
    $("backLink").textContent = "← All drills"; $("backLink").href = "../index.html";
    const next = R.find(c => !chState(c).finished) || R[0];
    $("view").innerHTML = `<p class="rd-lead">Read the course one short passage at a time. After each passage, answer a few questions about what you just read, then keep reading. Start here, before the drills.</p>
      <div class="rd-how"><b>How it works:</b> each chapter is a few short passages (about a minute each). Answer ${NEED} questions to unlock the next passage; any extra ones are bonus practice. Your answers count toward the Multiple-Choice Drill and earn Dexter XP and gold like any other answer.</div>
      <div class="rd-list">${R.map((c, i) => {
        const p = chProgress(c), S = chState(c), mins = Math.max(2, Math.round(words(c) / 200));
        const go = S.finished ? "Read again" : p.answered || S.at ? "Continue" : c === next ? "Start" : "Read";
        return `<a class="rd-ch${S.finished ? " done" : ""}" href="#${c.id}"><span class="rd-num">${S.finished ? "✓" : i + 1}</span>
          <span><h3>${esc(c.title)}</h3><p>${c.ch} · ${c.sections.length} passages · ${totalQs(c)} questions · about ${mins} min${p.answered ? ` · ${p.right} of ${p.answered} right` : ""}</p><span class="rd-bar"><i style="width:${p.pct}%"></i></span></span>
          <span class="rd-go">${go} ›</span></a>`;
      }).join("")}</div>`;
  }

  // ---- one question, inline
  function qHTML(c, id, active) {
    const x = B.q[id], A = chState(c).a[id];
    const img = x.img ? `<figure class="fig"><button type="button" class="zoom" data-src="../drill/${esc(x.img[0])}" data-alt="${esc(x.img[1])}" aria-label="Enlarge image: ${esc(x.img[1])}"><img src="../drill/${esc(x.img[0])}" alt="${esc(x.img[1])}"></button><figcaption>Tap to zoom</figcaption></figure>` : "";
    if (A) {
      const why = window.GLOSS && !A.ok ? window.GLOSS.look(A.p) : null;
      return `<div class="rd-q card past" data-id="${id}"><p class="q">${x.q}</p>${img}
        <div class="opts">${A.o.map((t, j) => `<button class="opt${t === x.ok ? " right" : ""}${t === A.p ? " picked" : ""}${t === A.p && !A.ok ? " wrong" : ""}" disabled><span class="bub">${"ABCDE"[j]}</span><span>${t}</span></button>`).join("")}</div>
        <div class="explain ${A.ok ? "good" : "bad"}"><strong>${A.ok ? "Correct!" : "Not quite. The answer is: " + x.ok}</strong>${x.ex ? `<span class="exwhy"><b>Why:</b> ${x.ex}</span>` : ""}${why ? `<span class="whynot"><b>Why not “${esc(plain(A.p))}”?</b> ${esc(why)}</span>` : ""}</div></div>`;
    }
    if (!active) return "";
    const opts = CUR[id] || (CUR[id] = shuffle([x.ok, ...x.wrong]));
    return `<div class="rd-q card" data-id="${id}"><p class="q">${x.q}</p>${img}
      <div class="opts">${opts.map((t, j) => `<button class="opt" data-t="${j}"><span class="bub">${"ABCDE"[j]}</span><span>${t}</span></button>`).join("")}</div></div>`;
  }
  function checkHTML(c, s, si) {
    const S = chState(c), done = answeredIn(c, s), n = s.qs.length, nextId = s.qs.find(id => !S.a[id]);
    const unlocked = done >= need(s), last = si === c.sections.length - 1;
    let more = "";
    if (si === S.at && !S.finished) {
      if (unlocked) more = `<div class="rd-more"><button class="btn" data-act="next">${last ? "Finish the chapter" : "Keep reading ↓"}</button>${nextId ? `<span class="rd-skip" style="text-decoration:none">or answer the bonus question${n - done > 1 ? `s (${n - done} left)` : ""} first</span>` : ""}</div>`;
      else more = `<div class="rd-more"><button class="rd-skip" data-act="skip">Skip the questions and keep reading</button></div>`;
    } else if (nextId && unlocked) more = "";
    return `<div class="rd-check"><div class="rd-cap">✎ Check yourself<span>${done} of ${n} answered${n > need(s) ? ` · ${need(s)} to keep reading` : ""}</span></div>
      ${s.qs.map(id => qHTML(c, id, id === nextId)).join("")}${more}</div>`;
  }
  function chapter(c) {
    const ci = R.indexOf(c), S = chState(c);
    document.title = "Read · " + c.title; $("title").textContent = c.title;
    $("backLink").textContent = "← All chapters"; $("backLink").href = "#";
    const p = chProgress(c), shown = c.sections.slice(0, S.finished ? c.sections.length : S.at + 1);
    const nextC = R[ci + 1];
    $("view").innerHTML = `<div class="rd-head"><p class="rd-kicker">${c.ch} · Chapter ${ci + 1} of ${R.length}</p><p class="rd-lead">${c.intro}</p></div>
      <div class="rd-sticky"><span>Passage ${Math.min(S.at + 1, c.sections.length)} of ${c.sections.length}</span><span class="rd-bar"><i style="width:${p.pct}%"></i></span><span>${p.right}/${p.answered} right</span></div>
      ${shown.map((s, i) => `<section class="rd-sec" id="sec${i}"><p class="rd-step">Passage ${i + 1}</p><h2>${s.h}</h2><div class="rd-prose">${s.html}</div>${checkHTML(c, s, i)}</section>`).join("")}
      ${S.finished ? endHTML(c, nextC) : S.at + 1 < c.sections.length ? `<div class="rd-locked">🔒 ${c.sections.length - S.at - 1} more passage${c.sections.length - S.at - 1 > 1 ? "s" : ""}: answer the questions above to keep reading</div>` : ""}`;
    wire(c);
  }
  function endHTML(c, nextC) {
    const p = chProgress(c), ids = c.sections.flatMap(s => s.qs), missedHere = ids.filter(id => chState(c).a[id] && !chState(c).a[id].ok).length;
    return `<section class="rd-sec rd-end card" id="end"><p class="rd-step">Chapter complete</p><h2>${esc(c.title)}</h2>
      ${p.answered ? `<div class="rd-score">${Math.round(100 * p.right / p.answered)}%</div><p class="rd-lead">${p.right} of ${p.answered} right${missedHere ? ` · ${missedHere} to review in the drill's Missed tab` : ""}</p>` : `<p class="rd-lead">You read the whole chapter. Try its questions in the drill next.</p>`}
      <div class="rd-more">${nextC ? `<a class="btn" href="#${nextC.id}">Next: ${esc(nextC.title)} ›</a>` : `<a class="btn" href="../mock/index.html">Take a Mock Exam ›</a>`}<a class="btn ghost" href="../drill/index.html">Practice in the drill</a><button class="btn ghost" data-act="reset">Read it again</button></div></section>`;
  }
  function wire(c) {
    const S = chState(c), view = $("view");
    view.querySelectorAll(".rd-q:not(.past) .opt").forEach(b => b.onclick = () => {
      const box = b.closest(".rd-q"), id = box.dataset.id, x = B.q[id];
      const o = CUR[id], p = o[+b.dataset.t], good = p === x.ok;
      box.querySelectorAll(".opt").forEach(e => { e.disabled = true; if (o[+e.dataset.t] === x.ok) e.classList.add("right") });
      b.classList.add("picked", good ? "pop" : "shake"); if (!good) b.classList.add("wrong");
      S.a[id] = { ok: good, p, o }; save();
      const h = drillRecord(id, good);
      window.dispatchEvent(new CustomEvent(good ? "bio:correct" : "bio:wrong", { detail: { kind: "drill", from: B.storageKey, id, q: x, prev: h.prev, prevHist: h.prevHist } }));
      const y = box.getBoundingClientRect().top;
      setTimeout(() => { rerender(c); const nb = view.querySelector(`.rd-q[data-id="${id}"]`); if (nb) scrollBy(0, nb.getBoundingClientRect().top - y) }, 450);
    });
    view.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
      const a = b.dataset.act;
      if (a === "reset") { st[c.id] = { at: 0, a: {} }; save(); chapter(c); scrollTo(0, 0); return }
      if (S.at >= c.sections.length - 1) { S.finished = true; save(); chapter(c); go("end"); return }
      S.at++; save(); chapter(c); go("sec" + S.at);
    });
    view.querySelectorAll(".zoom").forEach(z => z.onclick = () => { $("lbImg").src = z.dataset.src; $("lbImg").alt = z.dataset.alt; $("lightbox").hidden = false });
  }
  const go = id => requestAnimationFrame(() => { const e = $(id); if (e) e.scrollIntoView({ behavior: "smooth", block: "start" }) });
  function rerender(c) { chapter(c) }
  $("lbClose").onclick = () => $("lightbox").hidden = true; $("lightbox").onclick = e => { if (e.target.id === "lightbox") $("lightbox").hidden = true };

  function route() {
    const c = R.find(x => x.id === location.hash.slice(1));
    if (c) { chapter(c); const S = chState(c); if (S.at && !S.finished) go("sec" + S.at); else scrollTo(0, 0) } else { library(); scrollTo(0, 0) }
  }
  addEventListener("hashchange", route); route();
})();
</script>
</body></html>
